name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q --cov=promptfence --cov-report=term-missing

      - name: Type check
        run: mypy

      - name: Exported rules are current
        # web/rules.json feeds the static demo. Fail if the Python rules moved
        # without regenerating it.
        run: python scripts/export_rules.py --check

      - name: Python/JavaScript parity
        # The demo re-implements scanning in JS. Two implementations drift
        # unless something checks, so compare verdicts, rules and spans.
        run: python scripts/check_parity.py

      - name: Benchmark gate
        # Offline fixtures need no network, so this runs on every push.
        run: |
          python -m benchmarks.run_bench --source fixtures \
            --fail-over-asr 0.0 --fail-over-fpr 0.0

      - name: Ablation without the canary rule
        run: |
          python -m benchmarks.run_bench --source fixtures \
            --disable-rule PF008 --fail-over-asr 0.0 --fail-over-fpr 0.0
