[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptfence"
version = "0.1.0"
description = "A layered, measurable defense against prompt injection for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Durbha" }]
keywords = ["prompt-injection", "llm-security", "ai-agents", "red-teaming", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
benchmarks = ["datasets>=2.18"]
app = ["gradio>=4.44"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/rohitDurbha/promptfence"
Issues = "https://github.com/rohitDurbha/promptfence/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/promptfence"]
